[server]
headless = true
maxUploadSize = 200

[theme]
# Tema CLARO — alineado al CSS custom de la app (corporate light).
# Antes estaba en oscuro y chocaba: widgets nativos oscuros + texto gris claro
# sobre tarjetas claras = ilegible. Ahora los nativos heredan el mismo claro.
base = "light"
primaryColor = "#1B4F72"
backgroundColor = "#F9FAFB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1F2937"
font = "sans serif"

[browser]
gatherUsageStats = false
